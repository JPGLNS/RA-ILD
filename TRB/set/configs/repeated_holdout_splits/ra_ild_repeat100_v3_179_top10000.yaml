split_set_version: '1.0'
split_set:
  id: ra_ild_repeat100_v3_179_top10000
  description: One hundred deterministic metadata-balanced 125/54 repeated holdouts for the complete 179-sample TRB cohort.
  status: development
  output_root: TRB/set/split_sets/ra_ild_repeat100_v3_179_top10000
source:
  metadata_files:
    - TRB/set/data_versions/trb_v3_179_top10000/metadata/metadata_total.csv
  sample_id_column: libraryid
  patient_id_column: patient
  require_one_sample_per_patient: true
  expected_samples: 179
  expected_patients: 179
split:
  strategy: repeated_holdout
  label_column: cohort
  repeats: 100
  train_size: 125
  holdout_size: 54
  exact_strata:
    - cohort
    - batch
  balance_categorical:
    - material
    - sex
  balance_numeric:
    - age
  candidates_per_repeat: 5000
  base_seed: 20260724
  diversity_weight: 0.05
  max_pairwise_holdout_jaccard: 0.35
  role_names:
    train: train
    holdout: holdout
