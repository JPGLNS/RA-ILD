linear_svm_scheme_version: "1.0"

scheme:
  id: trb_linear_svm_multi_block_example
  description: >-
    Example showing how one future scheme can tune multiple legal LinearSVC
    penalty/loss/class-weight structures without another framework upgrade.
  base_resolved_config: >-
    TRB/set/experiments/trb_scheme_pbmc_m0_m2_repeat100_fullgrid_v1/00_config/resolved_config.yaml
  output_root: >-
    TRB/set/experiments/trb_linear_svm_multi_block_example

model_engine:
  engine: linear_svc
  candidate_blocks:
    - id: l2_squared_hinge_balanced
      priority: 1
      penalty: l2
      loss: squared_hinge
      class_weight_grid: [balanced, none]
      C_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      dual: auto

    - id: l2_hinge_balanced
      priority: 2
      penalty: l2
      loss: hinge
      class_weight_grid: [balanced]
      C_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      dual: auto

    - id: l1_squared_hinge_balanced
      priority: 3
      penalty: l1
      loss: squared_hinge
      class_weight_grid: [balanced]
      C_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      dual: false

  max_iter: 10000
  tolerance: 1.0e-4
  zero_sd_tolerance: 1.0e-12
  fit_intercept: true
  intercept_scaling: 1.0
