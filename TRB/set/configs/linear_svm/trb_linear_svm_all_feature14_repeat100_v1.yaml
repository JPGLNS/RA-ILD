linear_svm_scheme_version: "1.0"

scheme:
  id: trb_linear_svm_all_feature14_repeat100_v1
  description: >-
    All-sample 14-model TRB feature-ablation study across 100 frozen repeated
    holdouts using LinearSVC. Core83, repeat-specific Top-K weighted,
    unweighted and combined 3-mer representations, and leakage-controlled
    dynamic public features are compared. Only C is tuned.
  base_resolved_config: >-
    TRB/set/experiments/trb_scheme_011_a1_a6_repeat100_fullgrid/00_config/resolved_config.yaml
  output_root: >-
    TRB/set/experiments/trb_linear_svm_all_feature14_repeat100_v1

models:
  A1_core83:
    description: Core83 static TRB features only.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
    dynamic_public: []

  A2_core83_weighted500:
    description: Core83 plus repeat-specific Top-500 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public: []

  A3_core83_unweighted500:
    description: Core83 plus repeat-specific Top-500 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_unweighted_top500
    dynamic_public: []

  A4_core83_both500:
    description: Core83 plus repeat-specific Top-500 weighted and unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top500
    dynamic_public: []

  A5_core83_public:
    description: Core83 plus eight leakage-controlled dynamic public-reference features.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
    dynamic_public:
      - all_ref_public_clone_ratio
      - all_ref_public_frequency_sum
      - shared_ref_clone_ratio
      - shared_ref_frequency_sum
      - RA_specific_ref_clone_ratio
      - RA_specific_ref_frequency_sum
      - ILD_specific_ref_clone_ratio
      - ILD_specific_ref_frequency_sum

  A6_core83_both50:
    description: Core83 plus repeat-specific Top-50 weighted and unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top50
    dynamic_public: []

  A6_core83_both100:
    description: Core83 plus repeat-specific Top-100 weighted and unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top100
    dynamic_public: []

  A6_core83_both200:
    description: Core83 plus repeat-specific Top-200 weighted and unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top200
    dynamic_public: []

  A7_core83_unweighted50:
    description: Core83 plus repeat-specific Top-50 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_unweighted_top50
    dynamic_public: []

  A8_core83_unweighted100:
    description: Core83 plus repeat-specific Top-100 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_unweighted_top100
    dynamic_public: []

  A9_core83_unweighted200:
    description: Core83 plus repeat-specific Top-200 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_unweighted_top200
    dynamic_public: []

  A10_core83_weighted50:
    description: Core83 plus repeat-specific Top-50 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top50
    dynamic_public: []

  A11_core83_weighted100:
    description: Core83 plus repeat-specific Top-100 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top100
    dynamic_public: []

  A12_core83_weighted200:
    description: Core83 plus repeat-specific Top-200 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top200
    dynamic_public: []

model_engine:
  engine: linear_svc
  candidate_blocks:
    - id: l2_squared_hinge_balanced
      priority: 1
      penalty: l2
      loss: squared_hinge
      class_weight_grid:
        - balanced
      C_grid:
        - 0.0001
        - 0.001
        - 0.01
        - 0.1
        - 1.0
        - 10.0
        - 100.0
        - 1000.0
      dual: auto

  max_iter: 10000
  tolerance: 1.0e-4
  zero_sd_tolerance: 1.0e-12
  fit_intercept: true
  intercept_scaling: 1.0
