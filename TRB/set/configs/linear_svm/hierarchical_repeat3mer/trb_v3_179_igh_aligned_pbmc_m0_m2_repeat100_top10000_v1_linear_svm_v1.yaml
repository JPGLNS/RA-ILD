    The exact cohort model definitions, outer/inner assignments, repeat-specific 3-mer
    contract, and public-reference cache are inherited from the corresponding V3 resolved
    config.
  base_resolved_config: TRB/set/experiments/trb_v3_179_igh_aligned_pbmc_m0_m2_repeat100_top10000_v1/00_config/resolved_config.yaml
