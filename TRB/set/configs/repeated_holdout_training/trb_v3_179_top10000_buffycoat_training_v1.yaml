training_bundle_version: '1.0'
bundle:
  id: trb_v3_180_buffycoat_training_inputs_v1
  description: Full-cohort static and sequence inputs for one hundred frozen 45/19 Buffycoat repeated holdouts.
  output_root: TRB/set/training_bundles/trb_v3_180_buffycoat_training_inputs_v1
split_set:
  assignments: TRB/set/split_sets/ra_ild_buffycoat_repeat100_v3_180/repeated_holdout_assignments.csv
  frozen_marker: TRB/set/split_sets/ra_ild_buffycoat_repeat100_v3_180/SPLITS_FROZEN.json
  train_role: train
  holdout_role: holdout
source:
  train_base_matrix: TRB/set/cohort_subsets/trb_v3_180_buffycoat_only/subset_train_base_matrix.csv.gz
  test_final_matrix: TRB/set/cohort_subsets/trb_v3_180_buffycoat_only/subset_test_final_matrix.csv.gz
  feature_manifest: TRB/set/data_versions/trb_v3_180/train/result/04_final_feature_matrix/04_feature_manifest.csv
  train_aa_clone_table_dir: TRB/set/data_versions/trb_v3_180/result/01b_AA_clone_table_top10000
  test_aa_clone_table_dir: TRB/set/data_versions/trb_v3_180/result/01b_AA_clone_table_top10000
  sample_id_column: sample_id
  label_column: cohort
  required_metadata_columns:
    - cohort
    - batch
    - material
    - sex
    - age
    - aa_clone_number
aa_tables:
  sequence_column: cdr3_aa
  frequency_column_candidates:
    - frequency_norm
    - frequency
    - read_fraction
  file_globs:
    - '**/*.csv'
    - '**/*.csv.gz'
inner_cv:
  folds: 5
  exact_strata:
    - cohort
  balance_categorical:
    - batch
    - sex
  balance_numeric:
    - age
  candidates: 500
  base_seed: 20260724
scheme:
  template: TRB/set/configs/schemes/trb_scheme_material_homogeneous_no_clinical_template.yaml
  generated_scheme: TRB/set/configs/schemes/generated/trb_scheme_buffycoat_repeat100_no_clinical_v3_180.generated.yaml
  id: trb_scheme_buffycoat_repeat100_no_clinical_v3_180
  output_root: TRB/set/experiments/trb_scheme_buffycoat_repeat100_no_clinical_v3_180
