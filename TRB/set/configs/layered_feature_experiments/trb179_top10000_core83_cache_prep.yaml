schema_version: '1.0'

experiment:
  id: trb179_top10000_core83_cache_prep
  receptor: TRB

cohort:
  scope: total

repertoire:
  mode: topk
  top_k: 10000

features:
  clinical_groups:
    - clinical_age_sex
  static_tcr_groups:
    - tcr_diversity
    - tcr_clonal_expansion
    - tcr_aa_length
    - tcr_aa_composition_unweighted
    - tcr_aa_composition_weighted
    - tcr_physicochemical_unweighted
    - tcr_physicochemical_weighted
  kmer:
    enabled: false
    k: 3
    representation: both
    top_n: 500
    min_sample_count: 5
    min_prevalence: 0.05
    min_unweighted_variance: 1.0e-12
    min_weighted_variance: 1.0e-12
  enriched_dictionary:
    enabled: false
    threshold_pct: 20.0
    delta_pct: 10.0
    features: []

model:
  algorithm: elastic_net
  positive_label: ILD
  negative_label: RA
  tuning_primary_metric: roc_auc
  zero_sd_tolerance: 1.0e-12
  parameters:
    elastic_net:
      alpha_grid: [0.1, 0.5, 0.9]
      lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
      class_weight: balanced
      max_iter: 10000
      tolerance: 1.0e-4

validation:
  folds: 5
  repeats: 100
  split_candidates: 300
  seed: 20260711
  inner_split_candidates: 500
  inner_split_seed: 20260724
  split_assignments: TRB/set/split_sets/ra_ild_repeat100_v3_179_top10000/repeated_holdout_assignments.csv

compute:
  workers: 1
