feature_ablation_scheme_version: '1.0'
scheme:
  id: trb_scheme_012_additional6_repeat100_fullgrid
  description: Six additional weighted and unweighted Top-K feature models evaluated
    across the same 100 frozen repeated holdouts and the same full Elastic Net regularization
    grid.
  base_resolved_config: TRB/set/experiments/trb_scheme_003_repeat100_no_clinical/00_config/resolved_config.yaml
  output_root: TRB/set/experiments/trb_scheme_012_additional6_repeat100_fullgrid
repeat_3mer_features:
  enabled: true
  selection_scope: outer_repeat_train_only
  ranking_rule: prevalence_then_total_variance
  aa_manifest: TRB/set/training_bundles/trb_repeat100_training_inputs_v1/aa_clone_table_manifest.csv
  sequence_column: cdr3_aa
  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12
  max_kmers: 500
  top_k_values:
  - 50
  - 100
  - 200
  - 500
  expected_core_feature_count: 83
  core_group_name: core83
  legacy_group_name: static_tcr_candidate_predictors
models:
  A7_core83_unweighted50:
    description: Core 83 plus repeat-specific Top-50 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_unweighted_top50
    dynamic_public: []
  A8_core83_unweighted100:
    description: Core 83 plus repeat-specific Top-100 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_unweighted_top100
    dynamic_public: []
  A9_core83_unweighted200:
    description: Core 83 plus repeat-specific Top-200 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_unweighted_top200
    dynamic_public: []
  A10_core83_weighted50:
    description: Core 83 plus repeat-specific Top-50 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_weighted_top50
    dynamic_public: []
  A11_core83_weighted100:
    description: Core 83 plus repeat-specific Top-100 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_weighted_top100
    dynamic_public: []
  A12_core83_weighted200:
    description: Core 83 plus repeat-specific Top-200 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
    - core83
    - repeat_3mer_weighted_top200
    dynamic_public: []
model_engine:
  alpha_grid:
  - 0.0
  - 0.1
  - 0.25
  - 0.5
  - 0.75
  - 0.9
  - 1.0
  lambda_grid:
  - 0.01
  - 0.03
  - 0.1
  - 0.3
  - 1.0
  - 3.0
  - 10.0
  - 30.0
