feature_ablation_scheme_version: "1.0"

scheme:
  id: trb_scheme_006_weighted_topk_repeat3
  description: >-
    Three frozen repeated holdouts comparing core 83 features with
    repeat-specific weighted Top-50, Top-100, Top-200, and Top-500
    3-mer feature groups. The original alpha/lambda grid is retained
    to isolate the effect of weighted 3-mer feature count.
  base_resolved_config: >-
    TRB/set/experiments/trb_scheme_003_repeat3_no_clinical/00_config/resolved_config.yaml
  output_root: TRB/set/experiments/trb_scheme_006_weighted_topk_repeat3

# Do not add model_engine here.
# This experiment inherits the original alpha grid [0.1, 0.5, 0.9].

repeat_3mer_features:
  enabled: true
  selection_scope: outer_repeat_train_only
  ranking_rule: prevalence_then_total_variance
  aa_manifest: >-
    TRB/set/training_bundles/trb_repeat3_training_inputs_v1/aa_clone_table_manifest.csv
  sequence_column: cdr3_aa

  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12

  max_kmers: 500
  top_k_values: [50, 100, 200, 500]

  expected_core_feature_count: 83
  core_group_name: core83
  legacy_group_name: static_tcr_candidate_predictors

models:
  W0_core83:
    description: Core 83 static TRB features only.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
    dynamic_public: []

  W50_core83_weighted50:
    description: Core 83 plus repeat-specific Top-50 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top50
    dynamic_public: []

  W100_core83_weighted100:
    description: Core 83 plus repeat-specific Top-100 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top100
    dynamic_public: []

  W200_core83_weighted200:
    description: Core 83 plus repeat-specific Top-200 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top200
    dynamic_public: []

  W500_core83_weighted500:
    description: Core 83 plus repeat-specific Top-500 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public: []
