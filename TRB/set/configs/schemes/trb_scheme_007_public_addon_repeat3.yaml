feature_ablation_scheme_version: "1.0"

scheme:
  id: trb_scheme_007_public_addon_repeat3
  description: >-
    Three frozen repeated holdouts testing whether eight dynamic
    public-reference features add predictive value to the two preferred
    repeat-specific 3-mer feature combinations: weighted Top-500 and
    weighted/unweighted both Top-50.
  base_resolved_config: >-
    TRB/set/experiments/trb_scheme_003_repeat3_no_clinical/00_config/resolved_config.yaml
  output_root: TRB/set/experiments/trb_scheme_007_public_addon_repeat3

# Keep the original alpha/lambda grid so that this experiment isolates
# the incremental effect of dynamic public-reference features.

repeat_3mer_features:
  enabled: true
  selection_scope: outer_repeat_train_only
  ranking_rule: prevalence_then_total_variance
  aa_manifest: >-
    TRB/set/training_bundles/trb_repeat3_training_inputs_v1/aa_clone_table_manifest.csv
  sequence_column: cdr3_aa

  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12

  max_kmers: 500
  top_k_values: [50, 500]

  expected_core_feature_count: 83
  core_group_name: core83
  legacy_group_name: static_tcr_candidate_predictors

models:
  B1_core83_weighted500:
    description: Core 83 plus repeat-specific weighted Top-500 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public: []

  A7W_core83_weighted500_public:
    description: Core 83 plus weighted Top-500 3-mers and eight dynamic public features.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public:
      - all_ref_public_clone_ratio
      - all_ref_public_frequency_sum
      - shared_ref_clone_ratio
      - shared_ref_frequency_sum
      - RA_specific_ref_clone_ratio
      - RA_specific_ref_frequency_sum
      - ILD_specific_ref_clone_ratio
      - ILD_specific_ref_frequency_sum

  B2_core83_both50:
    description: Core 83 plus both weighted and unweighted Top-50 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top50
    dynamic_public: []

  A7B_core83_both50_public:
    description: Core 83 plus both Top-50 3-mers and eight dynamic public features.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top50
    dynamic_public:
      - all_ref_public_clone_ratio
      - all_ref_public_frequency_sum
      - shared_ref_clone_ratio
      - shared_ref_frequency_sum
      - RA_specific_ref_clone_ratio
      - RA_specific_ref_frequency_sum
      - ILD_specific_ref_clone_ratio
      - ILD_specific_ref_frequency_sum
