feature_ablation_scheme_version: "1.0"

scheme:
  id: trb_scheme_005_parameter_tuning_template
  description: >-
    Template for comparing two manually selected feature combinations across
    Ridge, Elastic Net, and Lasso alpha values using the same three frozen
    repeated holdouts.
  base_resolved_config: >-
    TRB/set/experiments/trb_scheme_003_repeat3_no_clinical/00_config/resolved_config.yaml
  output_root: TRB/set/experiments/trb_scheme_005_parameter_tuning_template

# Batch 10: these values override model_engine in the base resolved config.
# alpha=0.0: Ridge endpoint; 0<alpha<1: Elastic Net; alpha=1.0: Lasso endpoint.
model_engine:
  alpha_grid: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
  # lambda_grid is optional. Omit it to inherit the existing lambda grid.
  # lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]

repeat_3mer_features:
  enabled: true
  selection_scope: outer_repeat_train_only
  ranking_rule: prevalence_then_total_variance
  aa_manifest: >-
    TRB/set/training_bundles/trb_repeat3_training_inputs_v1/aa_clone_table_manifest.csv
  sequence_column: cdr3_aa
  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12
  max_kmers: 500
  top_k_values: [50, 100, 200, 500]
  expected_core_feature_count: 83
  core_group_name: core83
  legacy_group_name: static_tcr_candidate_predictors

# Replace these two model definitions with the two feature combinations selected
# from the preceding feature-ablation experiment. The current entries are working
# examples based on the descriptive ranking from Scheme 004.
models:
  P1_core83_weighted500:
    description: Core 83 plus repeat-specific Top-500 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public: []

  P2_core83_both50:
    description: Core 83 plus both representations of repeat-specific Top-50 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top50
    dynamic_public: []
