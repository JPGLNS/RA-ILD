scheme_version: "1.0"

scheme:
  id: "trb_scheme_002_no_clinical"
  description: "Development scheme without M0, age, or sex; M1-M3 retain the frozen static/public definitions."
  status: "development"
  base_config: "TRB/set/configs/trb_baseline_m2_v1.yaml"
  output_root: "TRB/set/experiments/trb_scheme_002_no_clinical"

# Complete replacement is required when a model must be deleted. Recursive overrides
# alone cannot remove the inherited M0 mapping.
replacements:
  models:
    M1_static_tcr:
      description: "Static TRB repertoire features only."
      numeric: []
      categorical: []
      static_feature_groups: ["static_tcr_candidate_predictors"]
      dynamic_public: []

    M2_static_tcr_public:
      description: "Static TRB features plus dynamic public-reference features."
      numeric: []
      categorical: []
      static_feature_groups: ["static_tcr_candidate_predictors"]
      dynamic_public:
        - "all_ref_public_clone_ratio"
        - "all_ref_public_frequency_sum"
        - "shared_ref_clone_ratio"
        - "shared_ref_frequency_sum"
        - "RA_specific_ref_clone_ratio"
        - "RA_specific_ref_frequency_sum"
        - "ILD_specific_ref_clone_ratio"
        - "ILD_specific_ref_frequency_sum"

    M3_static_tcr_public_material:
      description: "M2 plus material as a sensitivity model."
      numeric: []
      categorical: ["material"]
      static_feature_groups: ["static_tcr_candidate_predictors"]
      dynamic_public:
        - "all_ref_public_clone_ratio"
        - "all_ref_public_frequency_sum"
        - "shared_ref_clone_ratio"
        - "shared_ref_frequency_sum"
        - "RA_specific_ref_clone_ratio"
        - "RA_specific_ref_frequency_sum"
        - "ILD_specific_ref_clone_ratio"
        - "ILD_specific_ref_frequency_sum"

overrides:
  final_model:
    status: "not_selected"
