material_subset_version: "1.0"

subset:
  id: trb_buffercoat_only_v1
  description: Buffy-coat-only RA versus RA-ILD TRB analysis population.
  output_root: TRB/set/cohort_subsets/trb_buffercoat_only_v1

source:
  metadata_files:
    - TRB/set/train/metadata_train_70.csv
    - TRB/set/test/metadata_test_30.csv
  train_base_matrix: TRB/set/train/result/04_final_feature_matrix/04_train_base_feature_matrix.csv
  test_final_matrix: TRB/set/test/result/04_final_feature_matrix/04_test_final_feature_matrix.csv
  metadata_sample_id_column: libraryid
  matrix_sample_id_column: sample_id
  patient_id_column: patient
  label_column: cohort
  require_one_sample_per_patient: true

filter:
  column: material
  include_values:
    - buffercoat
  case_insensitive: true
  strip_whitespace: true

expected:
  samples: 63
  patients: 63
  label_counts:
    RA: 41
    ILD: 22
  filter_counts:
    buffercoat: 63
