material_subset_version: "1.0"
subset:
  id: trb_v3_180_pbmc_only
  description: PBMC-only subset derived from the complete TRB V3 180 total-cohort 70:30 compatibility partition.
  output_root: TRB/set/cohort_subsets/trb_v3_180_pbmc_only
source:
  metadata_files:
    - TRB/set/data_versions/trb_v3_180/ml_compat/total/metadata_train_70.csv
    - TRB/set/data_versions/trb_v3_180/ml_compat/total/metadata_test_30.csv
  train_base_matrix: TRB/set/data_versions/trb_v3_180/train/result/04_final_feature_matrix/04_train_base_feature_matrix.csv
  test_final_matrix: TRB/set/data_versions/trb_v3_180/test/result/04_final_feature_matrix/04_test_final_feature_matrix.csv
  metadata_sample_id_column: libraryid
  matrix_sample_id_column: sample_id
  patient_id_column: patient
  label_column: cohort
  require_one_sample_per_patient: true
filter:
  column: material
  include_values:
    - pbmc
  case_insensitive: true
  strip_whitespace: true
expected:
  samples: 116
  patients: 116
  label_counts:
    RA: 69
    ILD: 47
  filter_counts:
    pbmc: 116
