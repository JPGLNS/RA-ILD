feature_ablation_scheme_version: "1.0"
scheme:
  id: "igh_scheme_buffercoat_a1_a6_repeat100_v1"
  description: "One hundred paired buffercoat-only IGH repeated holdouts comparing 14 core/public/repeat-specific 3-mer models with the full Ridge/Elastic-Net/Lasso grid."
  base_resolved_config: "IGH/set/experiments/igh_scheme_buffercoat_repeat100_no_clinical/00_config/resolved_config.yaml"
  output_root: "IGH/set/experiments/igh_scheme_buffercoat_a1_a6_repeat100_v1"
repeat_3mer_features:
  enabled: true
  selection_scope: "outer_repeat_train_only"
  ranking_rule: "prevalence_then_total_variance"
  aa_manifest: "IGH/set/training_bundles/igh_buffercoat_repeat100_training_inputs_v1/aa_clone_table_manifest.csv"
  sequence_column: "cdr3_aa"
  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12
  max_kmers: 500
  top_k_values: [50, 100, 200, 500]
  expected_core_feature_count: 83
  core_group_name: "core83"
  legacy_group_name: "static_igh_candidate_predictors"
models:

  A1_core83:
    description: "Core 83 static IGH features only."
    numeric: []
    categorical: []
    static_feature_groups: ["core83"]
    dynamic_public: []
  A2_core83_weighted500:
    description: "Core 83 plus repeat-specific Top-500 weighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_weighted_top500"]
    dynamic_public: []
  A3_core83_unweighted500:
    description: "Core 83 plus repeat-specific Top-500 unweighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_unweighted_top500"]
    dynamic_public: []
  A4_core83_both500:
    description: "Core 83 plus both representations of Top-500 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_both_top500"]
    dynamic_public: []
  A5_core83_public:
    description: "Core 83 plus eight dynamic public-reference features."
    numeric: []
    categorical: []
    static_feature_groups: ["core83"]
    dynamic_public:
      - "all_ref_public_clone_ratio"
      - "all_ref_public_frequency_sum"
      - "shared_ref_clone_ratio"
      - "shared_ref_frequency_sum"
      - "RA_specific_ref_clone_ratio"
      - "RA_specific_ref_frequency_sum"
      - "ILD_specific_ref_clone_ratio"
      - "ILD_specific_ref_frequency_sum"
  A6_core83_weighted50:
    description: "Core 83 plus repeat-specific Top-50 weighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_weighted_top50"]
    dynamic_public: []
  A6_core83_weighted100:
    description: "Core 83 plus repeat-specific Top-100 weighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_weighted_top100"]
    dynamic_public: []
  A6_core83_weighted200:
    description: "Core 83 plus repeat-specific Top-200 weighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_weighted_top200"]
    dynamic_public: []
  A6_core83_unweighted50:
    description: "Core 83 plus repeat-specific Top-50 unweighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_unweighted_top50"]
    dynamic_public: []
  A6_core83_unweighted100:
    description: "Core 83 plus repeat-specific Top-100 unweighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_unweighted_top100"]
    dynamic_public: []
  A6_core83_unweighted200:
    description: "Core 83 plus repeat-specific Top-200 unweighted 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_unweighted_top200"]
    dynamic_public: []
  A6_core83_both50:
    description: "Core 83 plus both representations of Top-50 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_both_top50"]
    dynamic_public: []
  A6_core83_both100:
    description: "Core 83 plus both representations of Top-100 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_both_top100"]
    dynamic_public: []
  A6_core83_both200:
    description: "Core 83 plus both representations of Top-200 3-mers."
    numeric: []
    categorical: []
    static_feature_groups: ["core83", "repeat_3mer_both_top200"]
    dynamic_public: []
model_engine:
  alpha_grid: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
  lambda_grid: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
