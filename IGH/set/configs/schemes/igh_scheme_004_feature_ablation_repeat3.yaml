feature_ablation_scheme_version: "1.0"

scheme:
  id: igh_scheme_004_feature_ablation_repeat3
  description: >-
    Three frozen 123/51 repeated holdouts comparing core 83 features,
    repeat-specific weighted/unweighted 3-mers, Top-K 3-mer subsets,
    and dynamic public-reference features without age, sex, or material.
  base_resolved_config: >-
    IGH/set/experiments/igh_scheme_003_repeat3_no_clinical/00_config/resolved_config.yaml
  output_root: IGH/set/experiments/igh_scheme_004_feature_ablation_repeat3

repeat_3mer_features:
  enabled: true
  selection_scope: outer_repeat_train_only
  ranking_rule: prevalence_then_total_variance
  aa_manifest: >-
    IGH/set/training_bundles/igh_repeat3_training_inputs_v1/aa_clone_table_manifest.csv
  sequence_column: cdr3_aa

  # Reproduce the original IGH step-02 unsupervised filters/ranking.
  min_sample_count: 5
  min_prevalence: 0.05
  min_unweighted_variance: 1.0e-12
  min_weighted_variance: 1.0e-12

  # One ranking is fitted per outer repeat. All K groups are nested prefixes.
  max_kmers: 500
  top_k_values: [50, 100, 200, 500]

  # The old 1083 static predictors are split into 83 core + 500 + 500.
  expected_core_feature_count: 83
  core_group_name: core83
  legacy_group_name: static_igh_candidate_predictors

models:
  A1_core83:
    description: Core 83 static IGH features only.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
    dynamic_public: []

  A2_core83_weighted500:
    description: Core 83 plus repeat-specific Top-500 weighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_weighted_top500
    dynamic_public: []

  A3_core83_unweighted500:
    description: Core 83 plus repeat-specific Top-500 unweighted 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_unweighted_top500
    dynamic_public: []

  A4_core83_both500:
    description: Core 83 plus both representations of repeat-specific Top-500 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top500
    dynamic_public: []

  A5_core83_public:
    description: Core 83 plus eight dynamic public-reference features.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
    dynamic_public:
      - all_ref_public_clone_ratio
      - all_ref_public_frequency_sum
      - shared_ref_clone_ratio
      - shared_ref_frequency_sum
      - RA_specific_ref_clone_ratio
      - RA_specific_ref_frequency_sum
      - ILD_specific_ref_clone_ratio
      - ILD_specific_ref_frequency_sum

  A6_core83_both50:
    description: Core 83 plus both representations of repeat-specific Top-50 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top50
    dynamic_public: []

  A6_core83_both100:
    description: Core 83 plus both representations of repeat-specific Top-100 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top100
    dynamic_public: []

  A6_core83_both200:
    description: Core 83 plus both representations of repeat-specific Top-200 3-mers.
    numeric: []
    categorical: []
    static_feature_groups:
      - core83
      - repeat_3mer_both_top200
    dynamic_public: []

# A6 Top-500 is identical to A4, so it is not duplicated as another model.
# A7 is intentionally deferred until the preferred Top-K/representation is frozen.
