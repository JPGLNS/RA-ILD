split_set_version: "1.1"

split_set:
  id: "replace_with_new_split_set_id"
  description: "Template for a new metadata-only IGH repeated-holdout split set."
  status: "development"
  output_root: "IGH/set/split_sets/replace_with_new_split_set_id"

source:
  metadata_files:
    - "IGH/set/train/metadata_train_70.csv"
    - "IGH/set/test/metadata_test_30.csv"
  sample_id_column: "libraryid"
  patient_id_column: "patient"
  require_one_sample_per_patient: true
  expected_samples: 169
  expected_patients: 169

split:
  strategy: "repeated_holdout"
  label_column: "cohort"
  repeats: 3
  train_size: 120
  holdout_size: 49
  exact_strata: ["cohort", "batch"]

  # Use error when every exact stratum has at least two patients. For the current
  # IGH cohort, fixed_train is required and the detected sample must be listed.
  singleton_strata_policy: "fixed_train"
  expected_fixed_train_sample_ids: ["MGI260202N01-31"]

  balance_categorical: ["material", "sex"]
  balance_numeric: ["age"]
  candidates_per_repeat: 5000
  base_seed: 20260726
  diversity_weight: 0.05
  max_pairwise_holdout_jaccard: 0.35
  role_names: {train: "train", holdout: "holdout"}
