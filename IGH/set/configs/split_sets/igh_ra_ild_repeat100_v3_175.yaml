split_set_version: '1.1'
split_set:
  id: igh_ra_ild_repeat100_v3_175
  description: IGH V3 total, 175 patients, 100 metadata-balanced repeated holdouts.
  status: development
  output_root: IGH/set/split_sets/igh_ra_ild_repeat100_v3_175
source:
  metadata_files:
  - IGH/set/data_versions/igh_v3_175/metadata.csv
  sample_id_column: libraryid
  patient_id_column: patient
  require_one_sample_per_patient: true
  expected_samples: 175
  expected_patients: 175
split:
  strategy: repeated_holdout
  label_column: cohort
  repeats: 100
  train_size: 122
  holdout_size: 53
  exact_strata:
  - cohort
  - batch
  singleton_strata_policy: fixed_train
  expected_fixed_train_sample_ids:
  - MGI260201R01-24
  balance_categorical:
  - material
  - sex
  balance_numeric:
  - age
  candidates_per_repeat: 5000
  base_seed: 20260726
  diversity_weight: 0.05
  max_pairwise_holdout_jaccard: 0.35
  role_names:
    train: train
    holdout: holdout
