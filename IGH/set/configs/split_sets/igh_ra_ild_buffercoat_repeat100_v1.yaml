split_set_version: "1.1"
split_set:
  id: "igh_ra_ild_buffercoat_repeat100_v1"
  description: "One hundred deterministic metadata-balanced 43/18 buffercoat-only IGH repeated holdouts."
  status: "development"
  output_root: "IGH/set/split_sets/igh_ra_ild_buffercoat_repeat100_v1"
source:
  metadata_files:
    - "IGH/set/cohort_subsets/igh_buffercoat_only_v1/subset_metadata.csv"
  sample_id_column: "libraryid"
  patient_id_column: "patient"
  require_one_sample_per_patient: true
  expected_samples: 61
  expected_patients: 61
split:
  strategy: "repeated_holdout"
  label_column: "cohort"
  repeats: 100
  train_size: 43
  holdout_size: 18
  exact_strata: ["cohort"]
  singleton_strata_policy: "error"
  expected_fixed_train_sample_ids: []
  balance_categorical: ["batch", "sex"]
  balance_numeric: ["age"]
  candidates_per_repeat: 5000
  base_seed: 20260812
  diversity_weight: 0.05
  max_pairwise_holdout_jaccard: 0.35
  role_names: {train: "train", holdout: "holdout"}
