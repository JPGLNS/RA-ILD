split_set_version: "1.1"

split_set:
  id: "igh_ra_ild_repeat3_v1"
  description: >-
    Three deterministic metadata-balanced 120/49 repeated holdouts reconstructed
    from the complete 169-patient IGH cohort. This is a reusable development split
    set, not an automatically selected scientific winner.
  status: "development"
  output_root: "IGH/set/split_sets/igh_ra_ild_repeat3_v1"

source:
  # Historical train/test roles are ignored. The files are combined only to
  # reconstruct the complete 169-patient cohort before new assignments are made.
  metadata_files:
    - "IGH/set/train/metadata_train_70.csv"
    - "IGH/set/test/metadata_test_30.csv"
  sample_id_column: "libraryid"
  patient_id_column: "patient"
  require_one_sample_per_patient: true
  expected_samples: 169
  expected_patients: 169

split:
  strategy: "repeated_holdout"
  label_column: "cohort"

  # These values are configuration, not Python constants. Create a new split-set
  # ID whenever repeats or train/holdout sizes are changed.
  repeats: 3
  train_size: 120
  holdout_size: 49

  exact_strata:
    - "cohort"
    - "batch"

  # IGH batch6 contains one ILD patient. Exact stratified splitting cannot place a
  # singleton in both partitions, so this explicitly audited patient remains in
  # training in every repeat. No singleton is handled silently.
  singleton_strata_policy: "fixed_train"
  expected_fixed_train_sample_ids:
    - "MGI260202N01-31"

  # Candidate ranking uses metadata only. No repertoire features, predictions,
  # AUC values, or independent-test performance may influence assignment choice.
  balance_categorical:
    - "material"
    - "sex"
  balance_numeric:
    - "age"

  candidates_per_repeat: 5000
  base_seed: 20260726
  diversity_weight: 0.05
  max_pairwise_holdout_jaccard: 0.35

  role_names:
    train: "train"
    holdout: "holdout"
