training_bundle_version: "1.0"

bundle:
  id: "igh_repeat3_training_inputs_v1"
  description: "Full-cohort static features and sparse sequence representation for three frozen 120/49 repeated holdouts."
  output_root: "IGH/set/training_bundles/igh_repeat3_training_inputs_v1"

split_set:
  assignments: "IGH/set/split_sets/igh_ra_ild_repeat3_v1/repeated_holdout_assignments.csv"
  frozen_marker: "IGH/set/split_sets/igh_ra_ild_repeat3_v1/SPLITS_FROZEN.json"
  train_role: "train"
  holdout_role: "holdout"

source:
  train_base_matrix: "IGH/set/train/result/04_final_feature_matrix/04_train_base_feature_matrix.csv"
  test_final_matrix: "IGH/set/test/result/04_final_feature_matrix/04_test_final_feature_matrix.csv"
  feature_manifest: "IGH/set/train/result/04_final_feature_matrix/04_feature_manifest.csv"
  train_aa_clone_table_dir: "IGH/set/train/result/01_AA_clone_table"
  test_aa_clone_table_dir: "IGH/set/test/result/01_AA_clone_table"
  sample_id_column: "sample_id"
  label_column: "cohort"
  required_metadata_columns:
    - "cohort"
    - "batch"
    - "material"
    - "sex"
    - "age"
    - "aa_clone_number"

aa_tables:
  sequence_column: "cdr3_aa"
  frequency_column_candidates:
    - "frequency_norm"
    - "frequency"
    - "read_fraction"
  file_globs:
    - "**/*_IGH-without-DJ_CDR3_AA_clone_table.csv"
    - "**/*_IGH-without-DJ_CDR3_AA_clone_table.csv.gz"

inner_cv:
  folds: 5
  exact_strata:
    - "cohort"
  balance_categorical:
    - "batch"
    - "material"
    - "sex"
  balance_numeric:
    - "age"
  candidates: 500
  base_seed: 20260724

scheme:
  template: "IGH/set/configs/schemes/igh_scheme_002_no_clinical.yaml"
  generated_scheme: "IGH/set/configs/schemes/generated/igh_scheme_003_repeat3_no_clinical.generated.yaml"
  id: "igh_scheme_003_repeat3_no_clinical"
  output_root: "IGH/set/experiments/igh_scheme_003_repeat3_no_clinical"
