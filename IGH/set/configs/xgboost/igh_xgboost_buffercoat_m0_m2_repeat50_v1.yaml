xgboost_scheme_version: '1.0'
scheme:
  id: igh_xgboost_buffercoat_m0_m2_repeat50_v1
  description: Buffercoat-only IGH M0-M2 comparison across the first 50 frozen material-specific repeated
    holdouts using XGBoost.
  base_resolved_config: IGH/set/experiments/igh_scheme_buffercoat_a1_a6_repeat100_v1/00_config/resolved_config.yaml
  output_root: IGH/set/experiments/igh_xgboost_buffercoat_m0_m2_repeat50_v1
outer_repeats: 50
tuning_primary_metric: roc_auc
models:
  M0_clinical:
    description: Clinical baseline with age and sex.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups: []
    dynamic_public: []
  M1_static_igh:
    description: Age and sex plus Core83 and repeat-specific Top-500 weighted and unweighted 3-mers.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups:
    - core83
    - repeat_3mer_both_top500
    dynamic_public: []
  M2_static_igh_public:
    description: M1 plus eight leakage-controlled dynamic public-reference features.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups:
    - core83
    - repeat_3mer_both_top500
    dynamic_public:
    - all_ref_public_clone_ratio
    - all_ref_public_frequency_sum
    - shared_ref_clone_ratio
    - shared_ref_frequency_sum
    - RA_specific_ref_clone_ratio
    - RA_specific_ref_frequency_sum
    - ILD_specific_ref_clone_ratio
    - ILD_specific_ref_frequency_sum
model_engine:
  engine: xgboost
  fixed_parameters:
    objective: binary:logistic
    eval_metric: logloss
    tree_method: hist
    verbosity: 0
  early_stopping: false
  hyperparameters:
    max_depth:
    - 1
    - 2
    - 3
    min_child_weight:
    - 3
    - 5
    - 10
    learning_rate:
    - 0.03
    - 0.05
    subsample:
    - 0.7
    - 0.85
    colsample_bytree:
    - 0.3
    - 0.5
    - 0.7
    - 1.0
    reg_alpha:
    - 0.1
    - 0.5
    - 1.0
    reg_lambda:
    - 3.0
    - 5.0
    - 10.0
    gamma: 0.0
    scale_pos_weight: 1.0
    n_estimators:
    - 200
    - 300
    - 500
  search:
    strategy: random
    n_iter: 100
    random_state: 20260807
    replacement: false
  runtime:
    n_jobs_per_fit: 1
  zero_sd_tolerance: 1.0e-12
