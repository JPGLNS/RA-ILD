linear_svm_scheme_version: '1.0'
scheme:
  id: igh_linear_svm_all_m0_m3_repeat100_v1
  description: All-sample IGH M0-M3 hierarchical comparison across 100 frozen repeated
    holdouts using LinearSVC.
  base_resolved_config: IGH/set/experiments/igh_scheme_006_a1_a6_repeat100_fullgrid/00_config/resolved_config.yaml
  output_root: IGH/set/experiments/igh_linear_svm_all_m0_m3_repeat100_v1
models:
  M0_clinical:
    description: Clinical baseline with age and sex.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups: []
    dynamic_public: []
  M1_static_igh:
    description: Age and sex plus Core83 and repeat-specific Top-500 weighted and
      unweighted 3-mers.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups:
    - core83
    - repeat_3mer_both_top500
    dynamic_public: []
  M2_static_igh_public:
    description: M1 plus eight leakage-controlled dynamic public-reference features.
    numeric:
    - age
    categorical:
    - sex
    static_feature_groups:
    - core83
    - repeat_3mer_both_top500
    dynamic_public:
    - all_ref_public_clone_ratio
    - all_ref_public_frequency_sum
    - shared_ref_clone_ratio
    - shared_ref_frequency_sum
    - RA_specific_ref_clone_ratio
    - RA_specific_ref_frequency_sum
    - ILD_specific_ref_clone_ratio
    - ILD_specific_ref_frequency_sum
  M3_static_igh_public_material:
    description: M2 plus sample material.
    numeric:
    - age
    categorical:
    - sex
    - material
    static_feature_groups:
    - core83
    - repeat_3mer_both_top500
    dynamic_public:
    - all_ref_public_clone_ratio
    - all_ref_public_frequency_sum
    - shared_ref_clone_ratio
    - shared_ref_frequency_sum
    - RA_specific_ref_clone_ratio
    - RA_specific_ref_frequency_sum
    - ILD_specific_ref_clone_ratio
    - ILD_specific_ref_frequency_sum
model_engine:
  engine: linear_svc
  candidate_blocks:
  - id: l2_squared_hinge_balanced
    priority: 1
    penalty: l2
    loss: squared_hinge
    class_weight_grid:
    - balanced
    C_grid:
    - 0.0001
    - 0.001
    - 0.01
    - 0.1
    - 1.0
    - 10.0
    - 100.0
    - 1000.0
    dual: auto
  max_iter: 10000
  tolerance: 0.0001
  zero_sd_tolerance: 1.0e-12
  fit_intercept: true
  intercept_scaling: 1.0
